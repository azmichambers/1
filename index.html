    // HEADER & FOOTER HYDRATION

    function setDropdownState(isOpen) {
      const panel = document.getElementById('services-menu-panel');
      const btn = document.getElementById('services-menu-btn');
      const chevron = document.getElementById('services-menu-chevron');
      if (!panel || !btn || !chevron) return;

      panel.classList.toggle('hidden', !isOpen);
      btn.setAttribute('aria-expanded', String(isOpen));
      chevron.classList.toggle('rotate-180', isOpen);
    }

    function setMobileDrawerState(isOpen) {
      const drawer = document.getElementById('mobile-nav-drawer');
      const btn = document.getElementById('mobile-menu-trigger');
      const openIcon = document.getElementById('mobile-hamburger-icon');
      const closeIcon = document.getElementById('mobile-close-icon');
      if (!drawer || !btn || !openIcon || !closeIcon) return;

      drawer.classList.toggle('hidden', !isOpen);
      btn.setAttribute('aria-expanded', String(isOpen));
      openIcon.classList.toggle('hidden', isOpen);
      closeIcon.classList.toggle('hidden', !isOpen);
    }

    function navigateTo(event, route, scrollTargetId = null) {
      if (event) event.preventDefault();
      setDropdownState(false);
      setMobileDrawerState(false);
      showRoute(route, scrollTargetId);
      return false;
    }

    function navigateMobile(event, route) {
      if (event) event.preventDefault();
      setMobileDrawerState(false);
      showRoute(route);
      return false;
    }

    function populateHeaderAndFooter() {
      const f = SITE_CONTENT.firm;

      const setText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      };

      setText('header-brand-title', f.name);
      setText('header-brand-sub', f.location);
      setText('footer-brand-name', f.name);
      setText('footer-brand-sub', f.location);
      setText('footer-description', f.description);
      setText('footer-copyright-name', f.name);
      setText('footer-area-note', f.areaCaption);
      setText('footer-year', String(new Date().getFullYear()));

      const footerContactEl = document.getElementById('footer-contact-column');
      if (footerContactEl) {
        footerContactEl.innerHTML = `
          <p>${f.addressLines.join('<br />')}</p>
          <p><a href="tel:${f.phoneTelHref}" class="hover:text-white transition-colors">${f.phone}</a></p>
          <p><a href="mailto:${f.email}" class="hover:text-white transition-colors break-all">${f.email}</a></p>
        `;
      }

      const desktopItemsEl = document.getElementById('desktop-dropdown-items');
      if (desktopItemsEl) {
        desktopItemsEl.innerHTML = SITE_CONTENT.services.map((srv) => `
          <a href="#${srv.slug}" onclick="return navigateTo(event, '${srv.slug}');"
             class="block px-3 py-2.5 rounded-lg hover:bg-parchment transition-colors group">
            <span class="block text-xs font-semibold text-charcoal group-hover:text-bronze transition-colors">${srv.name}</span>
            <span class="block text-[11px] text-muted mt-0.5 line-clamp-1">${srv.summary}</span>
          </a>
        `).join('');
      }

      const mobileItemsEl = document.getElementById('mobile-drawer-items');
      if (mobileItemsEl) {
        mobileItemsEl.innerHTML = SITE_CONTENT.services.map((srv) => `
          <a href="#${srv.slug}" onclick="return navigateMobile(event, '${srv.slug}');"
             class="block px-3 py-2.5 rounded-lg bg-parchment/80 hover:bg-cream text-left transition-colors">
            <span class="block text-xs font-medium text-charcoal">${srv.name}</span>
          </a>
        `).join('');
      }

      const menuBtn = document.getElementById('services-menu-btn');
      const menuWrap = document.getElementById('services-menu-container');
      const mobileBtn = document.getElementById('mobile-menu-trigger');

      if (menuBtn) {
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const currentlyOpen = !document.getElementById('services-menu-panel').classList.contains('hidden');
          setDropdownState(!currentlyOpen);
        });
      }

      document.addEventListener('click', (e) => {
        if (menuWrap && !menuWrap.contains(e.target)) {
          setDropdownState(false);
        }
      });

      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
          const currentlyOpen = !document.getElementById('mobile-nav-drawer').classList.contains('hidden');
          setMobileDrawerState(!currentlyOpen);
        });
      }
    }

                <div class="lg:col-span-8 space-y-4">
                  <div class="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-parchment border border-borderwarm text-xs font-semibold text-charcoal">
                    <span class="text-bronze">${srv.icon}</span>
                    <span>${SITE_CONTENT.firm.name} &bull; ${srv.name}</span>
                  </div>
                  <h1 class="font-serif text-3xl sm:text-5xl font-semibold text-charcoal leading-[1.1]">
                    ${srv.name}
                  </h1>
                  <p class="text-base sm:text-lg text-inkbody leading-relaxed max-w-3xl">
                    ${srv.summary}
                  </p>
                </div>

                <div class="lg:col-span-4">
                  ${srv.illustration}
                </div>
              </div>
            </div>
          </section>

          <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-12 sm:py-16">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
              <div class="lg:col-span-8 space-y-8">
                <div class="bg-surface rounded-2xl border border-borderwarm p-6 sm:p-8 shadow-card space-y-3">
                  <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-charcoal">Overview</h2>
                  <p class="text-sm sm:text-base text-inkbody leading-relaxed">
                    ${srv.overview}
                  </p>
                </div>

                <div class="bg-surface rounded-2xl border border-borderwarm p-6 sm:p-8 shadow-card space-y-4">
                  <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-charcoal">Key Deliverables</h2>
                  <ul class="space-y-3 pt-1">
                    ${deliverablesList}
                  </ul>
                </div>

                <div class="bg-cream rounded-2xl border border-bronze/35 p-6 sm:p-7 space-y-2">
                  <p class="text-xs uppercase tracking-[0.2em] text-bronze font-semibold">Applicable Statutory Framework</p>
                  <p class="text-sm text-inkbody leading-relaxed">
                    ${srv.statutoryNote}
                  </p>
                </div>
              </div>

              <aside class="lg:col-span-4 space-y-6">
                <div class="bg-surface rounded-2xl border border-borderwarm p-6 sm:p-7 shadow-card space-y-4">
                  <h2 class="font-serif text-2xl font-semibold text-charcoal">Required Documents</h2>
                  <ul class="space-y-3 pt-1">
                    ${documentsList}
                  </ul>
                </div>

                <div class="bg-charcoal text-parchment rounded-2xl p-6 sm:p-7 space-y-4">
                  <p class="text-[11px] uppercase tracking-[0.2em] text-bronze font-semibold">${SITE_CONTENT.firm.name}</p>
                  <h3 class="font-serif text-2xl font-semibold text-white">${srv.name}</h3>
                  <button type="button" onclick="goToContactWithService(${srv.id});"
                          class="w-full py-3.5 px-5 rounded-lg bg-bronze text-white text-xs uppercase tracking-[0.16em] font-semibold hover:bg-bronzedark transition-colors">
                    Contact &rarr;
                  </button>
                </div>
              </aside>
            </div>

            <div class="mt-14 pt-8 border-t border-borderwarm grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                ${prevService ? `
                  <a href="#${prevService.slug}" onclick="return navigateTo(event, '${prevService.slug}');"
                     class="group block p-5 rounded-xl bg-surface border border-borderwarm hover:border-bronze transition-all">
                    <span class="block text-[11px] uppercase tracking-[0.18em] text-muted group-hover:text-bronze">&larr; Previous Service</span>
                    <span class="block font-serif text-xl font-semibold text-charcoal mt-1">${prevService.name}</span>
                  </a>
                ` : `
                  <a href="#home" onclick="return navigateTo(event, 'home');"
                     class="group block p-5 rounded-xl bg-surface border border-borderwarm hover:border-bronze transition-all">
                    <span class="block text-[11px] uppercase tracking-[0.18em] text-muted group-hover:text-bronze">&larr; Back to Home</span>
                    <span class="block font-serif text-xl font-semibold text-charcoal mt-1">Home</span>
                  </a>
                `}
              </div>

              <div class="sm:text-right">
                ${nextService ? `
                  <a href="#${nextService.slug}" onclick="return navigateTo(event, '${nextService.slug}');"
                     class="group block p-5 rounded-xl bg-surface border border-borderwarm hover:border-bronze transition-all">
                    <span class="block text-[11px] uppercase tracking-[0.18em] text-muted group-hover:text-bronze">Next Service &rarr;</span>
                    <span class="block font-serif text-xl font-semibold text-charcoal mt-1">${nextService.name}</span>
                  </a>
                ` : `
                  <a href="#contact" onclick="return navigateTo(event, 'contact');"
                     class="group block p-5 rounded-xl bg-surface border border-borderwarm hover:border-bronze transition-all">
                    <span class="block text-[11px] uppercase tracking-[0.18em] text-muted group-hover:text-bronze">Next &rarr;</span>
                    <span class="block font-serif text-xl font-semibold text-charcoal mt-1">Contact Us</span>
                  </a>
                `}
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderContactHTML() {
      const f = SITE_CONTENT.firm;
      const c = SITE_CONTENT.contact;

      const serviceOptions = SITE_CONTENT.services.map((srv) => `
        <option value="${srv.id}" ${preselectedServiceId === srv.id ? 'selected' : ''}>
          ${srv.name}
        </option>
      `).join('');

      return `
        <div class="view-animate">
          <section class="bg-surface border-b border-borderwarm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-16 sm:py-24 text-center">
              <h1 class="font-serif text-4xl sm:text-5xl lg:text-6xl font-semibold text-charcoal leading-[1.08] mx-auto">
                ${c.heading}
              </h1>
            </div>
          </section>

          <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-14 sm:py-18">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">

              <div class="lg:col-span-5 space-y-6">
                <div class="bg-surface rounded-2xl border border-borderwarm p-6 sm:p-7 shadow-card space-y-5">
                  <div>
                    <p class="font-serif text-2xl font-semibold text-charcoal">${f.name}</p>
                    <p class="text-sm text-inkbody leading-relaxed mt-1">
                      ${f.addressLines.join('<br />')}
                    </p>
                  </div>

                  <div class="pt-4 border-t border-borderwarm">
                    <a href="tel:${f.phoneTelHref}" class="text-lg font-semibold text-charcoal hover:text-bronze transition-colors">
                      ${f.phone}
                    </a>
                  </div>

                  <div class="pt-4 border-t border-borderwarm">
                    <a href="mailto:${f.email}" class="text-lg font-semibold text-charcoal hover:text-bronze transition-colors break-all">
                      ${f.email}
                    </a>
                  </div>

                  <div class="pt-4 border-t border-borderwarm">
                    <a href="${f.whatsappUrl}" target="_blank" rel="noopener noreferrer"
                       class="w-full inline-flex items-center justify-center gap-2 py-3.5 px-5 rounded-lg bg-parchment border border-charcoal text-charcoal text-xs uppercase tracking-[0.16em] font-semibold hover:bg-charcoal hover:text-parchment transition-colors">
                      <span>WhatsApp</span>
                      <span aria-hidden="true">&rarr;</span>
                    </a>
                  </div>
                </div>
              </div>

              <div class="lg:col-span-7">
                <div class="bg-surface rounded-2xl border border-borderwarm p-6 sm:p-9 shadow-card">
                  <h2 class="font-serif text-3xl font-semibold text-charcoal mb-6">${c.formTitle}</h2>

                  <form id="azmi-contact-form" onsubmit="return submitContactForm(event);" class="space-y-4">
                    <div>
                      <label for="contact-service" class="block text-xs uppercase tracking-[0.14em] font-semibold text-charcoal mb-1.5">
                        Service *
                      </label>
                      <select id="contact-service" required
                              class="w-full px-4 py-3 rounded-lg bg-parchment border border-borderwarm text-sm text-charcoal focus:outline-none focus:border-bronze">
                        <option value="" disabled ${!preselectedServiceId ? 'selected' : ''}>Choose a service...</option>
                        ${serviceOptions}
                      </select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label for="contact-name" class="block text-xs uppercase tracking-[0.14em] font-semibold text-charcoal mb-1.5">
                          Name *
                        </label>
                        <input type="text" id="contact-name" required placeholder="Your name"
                               class="w-full px-4 py-3 rounded-lg bg-parchment border border-borderwarm text-sm text-charcoal focus:outline-none focus:border-bronze" />
                      </div>

                      <div>
                        <label for="contact-phone-email" class="block text-xs uppercase tracking-[0.14em] font-semibold text-charcoal mb-1.5">
                          Phone / Email *
                        </label>
                        <input type="text" id="contact-phone-email" required placeholder="7972002617 or name@example.com"
                               class="w-full px-4 py-3 rounded-lg bg-parchment border border-borderwarm text-sm text-charcoal focus:outline-none focus:border-bronze" />
                      </div>
                    </div>

                    <div>
                      <label for="contact-message" class="block text-xs uppercase tracking-[0.14em] font-semibold text-charcoal mb-1.5">
                        Message *
                      </label>
                      <textarea id="contact-message" rows="4" required placeholder="Write your message..."
                                class="w-full px-4 py-3 rounded-lg bg-parchment border border-borderwarm text-sm text-charcoal focus:outline-none focus:border-bronze"></textarea>
                    </div>

                    <div class="pt-2">
                      <button type="submit"
                              class="px-8 py-3.5 rounded-lg bg-charcoal text-parchment text-xs uppercase tracking-[0.18em] font-semibold hover:bg-bronze transition-colors">
                        ${c.submitButtonText}
                      </button>
                    </div>
                  </form>

                  <div id="contact-confirmation" class="hidden mt-6 p-5 rounded-xl bg-cream border border-bronze/40 space-y-3" role="status" aria-live="polite">
                    <p class="text-xs uppercase tracking-[0.18em] text-bronze font-semibold">Sent</p>
                    <p id="contact-confirmation-text" class="text-sm text-inkbody leading-relaxed"></p>
                    <div class="flex flex-wrap gap-3 pt-1">
                      <a id="contact-mailto-action" href="mailto:${f.email}"
                         class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-charcoal text-white text-xs uppercase tracking-[0.14em] font-semibold hover:bg-bronze transition-colors">
                        Open Email App &rarr;
                      </a>
                      <button type="button" onclick="resetContactFormView();"
                              class="px-4 py-2.5 rounded-lg bg-surface border border-borderwarm text-xs uppercase tracking-[0.14em] font-semibold text-charcoal hover:border-bronze transition-colors">
                        New Message
                      </button>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </section>
        </div>
      `;
    }

    function goToContactWithService(serviceId) {
      preselectedServiceId = serviceId;
      showRoute('contact');
    }

    function submitContactForm(event) {
      event.preventDefault();
      try {
        const f = SITE_CONTENT.firm;
        const selectEl = document.getElementById('contact-service');
        const nameEl = document.getElementById('contact-name');
        const phoneEmailEl = document.getElementById('contact-phone-email');
        const messageEl = document.getElementById('contact-message');

        const selectedId = parseInt(selectEl.value, 10);
        const srv = SITE_CONTENT.services.find((item) => item.id === selectedId);
        const serviceName = srv ? srv.name : 'Service';
        const senderName = nameEl.value.trim();
        const senderContact = phoneEmailEl.value.trim();
        const messageBody = messageEl.value.trim();

        const subject = encodeURIComponent(`${serviceName} — ${senderName}`);
        const body = encodeURIComponent(
          `Service: ${serviceName}\nName: ${senderName}\nPhone / Email: ${senderContact}\n\nMessage:\n${messageBody}`
        );

        document.getElementById('contact-confirmation-text').textContent =
          `Thank you, ${senderName}. Your message regarding "${serviceName}" (${senderContact}) has been recorded for ${f.name}. You can also launch your email client below or reach ${f.email} / ${f.phone}.`;
        document.getElementById('contact-mailto-action').href = `mailto:${f.email}?subject=${subject}&body=${body}`;

        document.getElementById('azmi-contact-form').classList.add('hidden');
        document.getElementById('contact-confirmation').classList.remove('hidden');
      } catch (err) {
        // Fallback confirmation if DOM lookup fails
      }
      return false;
    }

    function resetContactFormView() {
      const form = document.getElementById('azmi-contact-form');
      const box = document.getElementById('contact-confirmation');
      if (form) {
        form.reset();
        form.classList.remove('hidden');
      }
      if (box) {
        box.classList.add('hidden');
      }
    }

    // =========================================================================
    // CLIENT-SIDE ROUTER (#home, #service-1..#service-12, #contact)
    // =========================================================================
    let currentFallbackRoute = 'home';

    function setActiveNavLink(activeKey) {
      const homeLink = document.getElementById('nav-home');
      const servicesBtn = document.getElementById('services-menu-btn');
      const contactLink = document.getElementById('nav-contact');

      [homeLink, servicesBtn, contactLink].forEach((el) => {
        if (!el) return;
        el.classList.remove('border-bronze', 'text-charcoal');
        el.classList.add('border-transparent', 'text-inkbody');
      });

      if (activeKey === 'contact' && contactLink) {
        contactLink.classList.remove('border-transparent', 'text-inkbody');
        contactLink.classList.add('border-bronze', 'text-charcoal');
      } else if (activeKey.startsWith('service-') && servicesBtn) {
        servicesBtn.classList.remove('border-transparent', 'text-inkbody');
        servicesBtn.classList.add('border-bronze', 'text-charcoal');
      } else if (homeLink) {
        homeLink.classList.remove('border-transparent', 'text-inkbody');
        homeLink.classList.add('border-bronze', 'text-charcoal');
      }
    }

    function renderView(rawRoute, scrollTargetId = null) {
      const root = document.getElementById('view-root');
      if (!root) return;

      let route = (rawRoute || currentFallbackRoute || 'home').replace(/^#/, '').trim().toLowerCase();
      if (!route || route === '/') route = 'home';

      if (route.startsWith('service-')) {
        const serviceNum = parseInt(route.replace('service-', ''), 10);
        if (!Number.isNaN(serviceNum) && serviceNum >= 1 && serviceNum <= 12) {
          const srv = SITE_CONTENT.services.find((s) => s.id === serviceNum);
          root.innerHTML = renderServicePageHTML(serviceNum);
          document.title = `${srv.name} — ${SITE_CONTENT.firm.name}`;
          setActiveNavLink(`service-${serviceNum}`);
          currentFallbackRoute = `service-${serviceNum}`;
        } else {
          route = 'home';
        }
      }

      if (route === 'contact') {
        root.innerHTML = renderContactHTML();
        document.title = `Contact — ${SITE_CONTENT.firm.name}`;
        setActiveNavLink('contact');
        currentFallbackRoute = 'contact';
      } else if (route === 'home') {
        root.innerHTML = renderHomeHTML();
        document.title = `${SITE_CONTENT.firm.name} — Legal Drafting, Title Due Diligence & Documentation`;
        setActiveNavLink('home');
        currentFallbackRoute = 'home';
      }

      if (scrollTargetId) {
        const targetEl = document.getElementById(scrollTargetId);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth' });
          return;
        }
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function showRoute(route, scrollTargetId = null) {
      const normalized = (route || 'home').replace(/^#/, '');
      currentFallbackRoute = normalized;
      try {
        window.location.hash = normalized;
      } catch (e) {
        // Fallback state rendering still runs even if hash mutation is restricted
      }
      renderView(normalized, scrollTargetId);
    }

    function initWebsite() {
      populateHeaderAndFooter();
      const initialHash = window.location.hash && window.location.hash !== '#' ? window.location.hash : 'home';
      renderView(initialHash);
    }

    window.addEventListener('hashchange', () => {
      renderView(window.location.hash || currentFallbackRoute);
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWebsite);
    } else {
      initWebsite();
    }
  </script>
</body>
</html>
